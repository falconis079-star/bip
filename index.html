<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0c10" />
  <title>Bip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud" class="hud hidden">
    <div class="left">
      <div class="title">BIP</div>
      <div id="roomHud">Прихожая</div>
    </div>
    <div class="right">
      <span id="waveHud">1/10</span>
      <span id="scoreHud">0 BC</span>
      <span id="hpHud">●●●</span>
    </div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <div class="brand-kicker">Private play</div>
      <h1>Bip</h1>
      <p class="wallet"><b id="coinHud">0</b> BC</p>
      <p id="saveLine"></p>
      <p id="liveLine" class="mini"></p>
      <button id="playBtn" class="go">Играть</button>
      <button id="farmBtn" class="soft">Тапалка</button>
      <button id="walletBtn" class="soft">Кошелёк</button>
      <button id="groupBtn" class="soft">Группа</button>
      <button id="resetBtn" class="ghost">Сброс комнаты</button>
    </div>
  </div>

  <div id="reg" class="overlay hidden">
    <div class="panel">
      <h2>Профиль</h2>
      <input id="regName" type="text" placeholder="Имя" />
      <input id="regMail" type="email" placeholder="Почта" />
      <input id="regPhone" type="tel" placeholder="Телефон" />
      <p class="mini" id="regHint">Имя нужно. Почта и телефон — по желанию, для связи по бете.</p>
      <button id="regBtn" class="go">Войти</button>
    </div>
  </div>

  <div id="roomOver" class="overlay hidden">
    <div class="panel">
      <h2 id="roomOverTitle">Комната</h2>
      <p id="roomOverText"></p>
      <div id="playerBox" class="player hidden"></div>
      <button id="clipBtn" class="soft">Выпуск</button>
      <button id="nextRoomBtn" class="go">Дальше</button>
      <button id="homeBtn" class="soft">Меню</button>
    </div>
  </div>

  <div id="farm" class="overlay hidden">
    <div class="panel farm-panel">
      <p id="farmBal">0 BC</p>
      <button id="farmTap" class="farm-hit" type="button"></button>
      <button id="farmBack" class="soft">Назад</button>
    </div>
  </div>

  <div id="wallet" class="overlay hidden">
    <div class="panel wallet-panel">
      <div class="ex-top">Wallet</div>
      <div class="ex-main" id="exMain">0 BC</div>
      <div class="ex-sub" id="exUsd"></div>
      <div class="ex-grid" id="exGrid"></div>
      <div class="row">
        <select id="swapFrom"></select>
        <select id="swapTo"></select>
      </div>
      <input id="swapAmt" type="number" min="0" step="0.01" placeholder="Сумма" />
      <p class="mini" id="swapHint"></p>
      <button id="swapBtn" class="go">Обмен</button>
      <input id="stakeAmt" type="number" min="10" step="1" placeholder="Депозит от 10 BC" />
      <p class="mini" id="stakeHint"></p>
      <div class="row">
        <button id="stakeBtn" class="soft">В депозит</button>
        <button id="unstakeBtn" class="soft">Снять</button>
      </div>
      <div class="row">
        <button id="topupBtn" class="soft dim">Deposit</button>
        <button id="withdrawBtn" class="soft dim">Withdraw</button>
      </div>
      <button id="walletBack" class="soft">Назад</button>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel slim">
      <h2>Пауза</h2>
      <button id="resumeBtn" class="go">Дальше</button>
      <button id="menuBtn" class="soft">Меню</button>
    </div>
  </div>

  <div id="end" class="overlay hidden">
    <div class="panel">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button id="againBtn" class="go">Меню</button>
    </div>
  </div>

  <button id="pauseBtn" class="pause hidden" type="button">❚❚</button>
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="config.js"></script>
  <script src="vk.js"></script>
  <script src="game.js"></script>
</body>
</html>
