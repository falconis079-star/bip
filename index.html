<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Бип дома</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">БИП ДОМА</div>
      <div class="hud">
        <span id="levelLabel">Ур. 1</span>
        <span id="scoreLabel">0</span>
        <span id="livesLabel">❤ 3</span>
      </div>
    </header>

    <main id="arena" class="arena">
      <div id="roomName" class="room-name">Прихожая</div>
      <div id="bip" class="bip">🤖</div>
      <div id="hint" class="hint">Жми по врагам!</div>
    </main>

    <footer class="bar">
      <div id="progress" class="progress"><i id="progressFill"></i></div>
      <button id="pauseBtn" class="ghost">Пауза</button>
    </footer>
  </div>

  <section id="screen" class="screen show">
    <div class="card">
      <h1>БИП ДОМА</h1>
      <p>Бип против квартиры. 10 комнат. После каждой — шортс из группы.</p>
      <button id="startBtn" class="primary">Начать бой</button>
      <button id="groupBtn" class="ghost">Группа Бипа</button>
      <p class="mini">Рекорд: <b id="bestScore">0</b></p>
    </div>
  </section>

  <section id="clipScreen" class="screen">
    <div class="card wide">
      <h2 id="clipTitle">Бонус уровня</h2>
      <p id="clipSub">Свежий выпуск Бипа</p>
      <div id="playerBox" class="player"></div>
      <button id="nextBtn" class="primary" disabled>Дальше</button>
      <button id="skipHint" class="ghost hidden">Кнопка откроется после ролика</button>
    </div>
  </section>

  <section id="overScreen" class="screen">
    <div class="card">
      <h2 id="overTitle">Бой окончен</h2>
      <p id="overText"></p>
      <button id="retryBtn" class="primary">Ещё раз</button>
      <button id="shareBtn" class="ghost">Поделиться</button>
      <button id="rewardBtn" class="ghost">Доп. жизнь за рекламу</button>
    </div>
  </section>

  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  <script src="config.js"></script>
  <script src="vk.js"></script>
  <script src="game.js"></script>
</body>
</html>
