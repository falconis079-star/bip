<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bip admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="overflow:auto;padding:20px">
  <div class="panel" style="margin:20px auto">
    <h2>Игроки</h2>
    <p id="count">Загрузка…</p>
    <div id="list"></div>
    <p class="mini">Нужен statsUrl в config.js и ключ ?key=bip-owner</p>
  </div>
  <script src="config.js"></script>
  <script>
    const key = new URLSearchParams(location.search).get("key") || "";
    const url = (window.BIP_CONFIG.statsUrl || "") + "?key=" + encodeURIComponent(key);
    fetch(url).then(r => r.json()).then(d => {
      document.getElementById("count").textContent = "Игроков: " + (d.players || 0);
      document.getElementById("list").innerHTML = (d.list || []).map(p =>
        "<div class='ex-cell' style='margin:6px 0'><b>" + (p.name||"—") + "</b>" +
        (p.email||"") + " " + (p.phone||"") + "<br>комната " + p.room + " · " + p.coins + " BC</div>"
      ).join("") || "Список доступен только с ключом владельца.";
    }).catch(() => {
      document.getElementById("count").textContent = "Скрипт статистики ещё не подключён.";
    });
  </script>
</body>
</html>
